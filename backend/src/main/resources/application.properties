# Configuración del servidor
server.port=8080

# ==========================================
# 1. Configuración de MySQL Local (ACTIVA)
# ==========================================
# Se añade allowPublicKeyRetrieval=true para evitar errores de conexión comunes
spring.datasource.url=jdbc:mysql://localhost:3306/usuariosdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin1234
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# 2. Configuración de H2 en memoria (COMENTADA)
# ==========================================
# spring.datasource.url=jdbc:h2:mem:usuariosdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ==========================================
# JPA / Hibernate Configuración Común
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# 4. MongoDB Local (ACTIVA)
# ==========================================
# Asegúrate de tener MongoDB instalado y corriendo en el puerto 27017
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=estadisticasdb

# ==========================================
# 5. MongoDB sin instancia local (COMENTADA)
#    Descomenta lo de abajo si NO tienes MongoDB y la app no arranca
# ==========================================
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

