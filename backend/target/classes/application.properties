# ==========================================
# JPA / Hibernate Configuración Común
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# 4. MongoDB Local (ACTIVA) CTRL + Ç
# ==========================================
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=estadisticasdb

# ==========================================
# 5. MongoDB sin instancia local - desactiva auto-configuración (COMENTADA)
