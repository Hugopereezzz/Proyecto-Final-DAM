<div class="app-root">

  <!-- ══ Background ══ -->
  <div class="bg-grid"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>


  <!-- ══ Main Content ══ -->
  <main class="app-main">
    @switch (game.phase()) {

      @case ('login') {
        <div class="login-wrapper phase-enter">
          <app-login (loginSuccess)="game.onLoginSuccess($event.username)" />
        </div>
      }

      @case ('lobby') {
        <app-lobby-principal [username]="game.loggedInUser() || 'Jugador'" />
      }

      @case ('selection') {
        <app-faction-select class="phase-enter" />
      }

      @case ('battle') {
        <div class="battle-view phase-enter">
          <app-battle-arena />
        </div>
      }

      @case ('gameover') {
        <app-game-over class="phase-enter" />
      }

    }
  </main>

</div>
