<div class="login-container">
  <div class="background-overlay"></div>

  <div class="login-card">
    <!-- Corner decorators -->
    <span class="corner top-left"></span>
    <span class="corner top-right"></span>
    <span class="corner bot-left"></span>
    <span class="corner bot-right"></span>

    <div class="login-header">
      <div class="logo-badge">W.A.R</div>
      <h1 class="war-title">W.A.R. NET</h1>
      <p class="war-sub">SISTEMA DE MANDO GLOBAL · AUTENTICACIÓN REQUERIDA</p>
      <div class="header-line"></div>
    </div>

    <form (submit)="onSubmit(); $event.preventDefault()" class="login-form">
      <div class="input-group">
        <label for="username">USUARIO</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" [ngModel]="username()" (ngModelChange)="username.set($event)" placeholder="Introduce tu nombre"
            [disabled]="isLoading()" autocomplete="off">
          <span class="input-line"></span>
        </div>
      </div>

      @if (isRegisterMode()) {
      <div class="input-group">
        <label for="email">EMAIL</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" [ngModel]="email()" (ngModelChange)="email.set($event)" placeholder="tu@email.com"
            [disabled]="isLoading()" autocomplete="off">
          <span class="input-line"></span>
        </div>
      </div>
      }

      <div class="input-group">
        <label for="password">CONTRASEÑA</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" [ngModel]="password()" (ngModelChange)="password.set($event)" placeholder="••••••••"
            [disabled]="isLoading()">
          <span class="input-line"></span>
        </div>
      </div>

      @if (error()) {
      <div class="error-message" [class.success]="error().includes('exitoso')">
        <span class="icon">{{ error().includes('exitoso') ? '✅' : '⚠️' }}</span> {{ error() }}
      </div>
      }

      <button type="submit" class="login-button" [disabled]="isLoading()">
        @if (isLoading()) {
        <span class="loader"></span>
        <span>{{ isRegisterMode() ? 'REGISTRANDO...' : 'AUTENTICANDO...' }}</span>
        } @else {
        <span>{{ isRegisterMode() ? 'CREAR MI CUENTA' : 'INGRESAR AL SISTEMA' }}</span>
        }
      </button>

      <div class="form-footer">
        @if (!isRegisterMode()) {
        <a href="#">¿Olvidaste tu contraseña?</a>
        }
        <div class="divider"></div>
        <button type="button" class="register-link" (click)="toggleMode()">
          {{ isRegisterMode() ? '¿YA TIENES CUENTA? INICIA SESIÓN' : 'CREAR NUEVA CUENTA' }}
        </button>
      </div>
    </form>
  </div>

  <div class="system-status">
    <div class="status-item">
      <span class="status-dot online"></span> SERVIDOR: ONLINE
    </div>
    <div class="status-item">
      v1.0.4-STABLE
    </div>
  </div>
</div>
